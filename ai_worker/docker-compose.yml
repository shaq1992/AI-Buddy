version: '3.8'

services:
  worker:
    image: ai_worker:v2.0.2
    container_name: ai_worker
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=ai-message-broker
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      # Point to the internal path of the key
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
      # Gemini API Key (ensure this is in your .env or passed here)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Access shared PDFs
      - ai_shared_data:/shared_data
      # Mount Google Cloud Credentials
      - ./service_account.json:/app/service_account.json
    networks:
      - ai-network
    restart: on-failure

networks:
  ai-network:
    external: true

volumes:
  ai_shared_data:
    external: true
